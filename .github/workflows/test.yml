name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Install Qt bindings
        run: python -m pip install "PySide6>=6.5,<7"
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Test quota interpretation
        run: python -m unittest discover -s . -p 'test_*.py'
      - name: Test the UI without credentials
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_CONFIG_HOME: /tmp/quotadock-test
          XDG_RUNTIME_DIR: /tmp/quotadock-runtime
        run: python quotadock.py --smoke-test
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt bindings
        run: python -m pip install "PySide6>=6.5,<7"
      - name: Check Python syntax and quota interpretation
        run: |
          python -m compileall -q .
          python -m unittest discover -s . -p "test_*.py"
      - name: Test the Windows UI without credentials
        env:
          QT_QPA_PLATFORM: offscreen
        run: python quotadock.py --smoke-test
      - name: Install for the current Windows user
        run: python install_windows.py --no-autostart
      - name: Test the installed copy
        env:
          QT_QPA_PLATFORM: offscreen
        run: '& "$env:LOCALAPPDATA\QuotaDock\.venv\Scripts\python.exe" "$env:LOCALAPPDATA\QuotaDock\quotadock.py" --smoke-test'
