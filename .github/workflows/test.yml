name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system Qt bindings
        run: sudo apt-get update && sudo apt-get install -y python3-pyqt6
      - name: Check Python syntax
        run: python3 -m compileall -q .
      - name: Test quota interpretation
        run: python3 -m unittest discover -s . -p 'test_*.py'
      - name: Test the UI without credentials
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_CONFIG_HOME: /tmp/quotadock-test
          XDG_RUNTIME_DIR: /tmp/quotadock-runtime
        run: python3 quotadock.py --smoke-test
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt bindings
        run: python -m pip install "PyQt6>=6.5,<7"
      - name: Check Python syntax and quota interpretation
        run: |
          python -m compileall -q .
          python -m unittest discover -s . -p "test_*.py"
      - name: Test the Windows UI without credentials
        env:
          QT_QPA_PLATFORM: offscreen
        run: python quotadock.py --smoke-test
