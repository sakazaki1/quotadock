[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quotadock"
version = "1.1.0"
description = "A local desktop monitor for server-reported Codex quota"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["PySide6>=6.5,<7"]

[project.scripts]
quotadock = "quotadock:main"

[tool.setuptools]
py-modules = ["quotadock", "limits", "i18n", "quota_core", "claude_source", "history", "windows_watcher"]
